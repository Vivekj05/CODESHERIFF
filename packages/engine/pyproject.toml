[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesheriff-engine"
version = "0.1.0"
description = "CodeSheriff Bayesian Fusion & Multi-Agent Integration Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codesheriff-engine = "codesheriff_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
