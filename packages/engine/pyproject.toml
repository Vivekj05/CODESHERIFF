[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesheriff-engine"
version = "0.1.0"
description = "CodeSheriff Bayesian Fusion & Multi-Agent Integration Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "codesheriff-contracts",
    # No fastapi, no uvicorn, no requests. The engine stopped serving HTTP and stopped calling
    # GitHub in Chapter 6: the webhook moved to apps/api and comment posting to apps/worker. A
    # fusion package that can open a socket is one import away from being called inline again.
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codesheriff-engine = "codesheriff_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
