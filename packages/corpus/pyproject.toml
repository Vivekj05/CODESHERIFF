[project]
name = "codesheriff-corpus"
version = "0.1.0"
description = "Labelled corpus with committed, immutable splits"
requires-python = ">=3.12"
dependencies = ["codesheriff-contracts", "pydantic>=2.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_corpus"]
