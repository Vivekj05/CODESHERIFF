# Chapter 12 negative control.
# Precedent that establishes no control at all. Retrieval succeeds and mining finds nothing
# to be missing, which must read as SILENCE — analysed, nothing regressed — and never as an
# abstention, which is the statement reserved for a repository with no history to consult.
rationale: >-
  The interpolated value is a column name the application chose, looked up through a
  fixed mapping; the untrusted string is only ever a key into that mapping and never
  reaches the statement. The f-string is deliberately retained: a rule keyed on
  "f-string containing SELECT" fires here, and would be wrong to.
