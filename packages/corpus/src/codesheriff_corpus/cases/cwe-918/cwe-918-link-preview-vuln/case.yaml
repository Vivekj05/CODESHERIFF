# Chapter 12 negative control.
# Both merged fetchers carry @rate_limit and neither twin does, so a classifier that read
# any repeated decorator as an access control would fire on both members. Rate limiting is
# availability, not authorization, and the agent must decline to map it to CWE-862.
rationale: >-
  urlopen on a URL pasted into a message. urlopen additionally accepts file:// and ftp://,
  so the reachable surface is wider than HTTP alone. The byte cap bounds the response
  size and does nothing about where the request goes. Keyed on LinkPreview.fetch.
