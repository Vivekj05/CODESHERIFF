label: vulnerable
cwe: CWE-862
file: app/internal/webhooks.py
symbol: replay_delivery
start_line: 88
decorators: ['@bp.post("/internal/webhooks/<int:delivery_id>/replay")']
imports: [flask.jsonify, flask.request]
detectable_by: [semantic.hosted, context.rag]
precedent:
  - pr_number: 204
    file: app/internal/webhooks.py
    qualified_symbol: list_deliveries
    source: 204-list_deliveries.py
  - pr_number: 219
    file: app/internal/jobs.py
    qualified_symbol: cancel_job
