rationale: >-
  The /internal prefix is a naming convention, not an access control, and this route
  enforces nothing. The two merged endpoints under the same prefix both carry
  @requires_scope with the same argument, which is what establishes that the prefix is
  expected to be paired with the decorator in this repository. A reader who has not seen
  those merges cannot tell that this route is unprotected rather than protected by the
  blueprint.
