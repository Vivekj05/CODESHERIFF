[project]
name = "codesheriff-agent-runtime"
version = "0.1.0"
description = "Runtime agent: Wasmtime + WASI software fault isolation"
requires-python = ">=3.12"
dependencies = ["codesheriff-contracts", "pydantic>=2.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
