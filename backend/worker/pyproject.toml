[project]
name = "codesheriff-worker"
version = "0.1.0"
description = "Celery worker: owns the audit pipeline and all agents"
requires-python = ">=3.12"
dependencies = [
    "codesheriff-contracts",
    "codesheriff-engine",
    "codesheriff-patch",
    "codesheriff-storage",
    "codesheriff-agent-static",
    "codesheriff-agent-semantic",
    "codesheriff-agent-context",
    "codesheriff-agent-runtime",
    "celery>=5.4.0",
    "redis>=5.0.0",
    # auth-app brings the JWT signing needed to mint installation tokens.
    "githubkit[auth-app]>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    # The precedent store's embedding model. Declared here, where it is used, and nowhere in an
    # agent package: AUDIT.md 3.8 is what happened when an analysis silently depended on this
    # library without asking for it, and answered with MD5 hashes when it was absent.
    "sentence-transformers>=2.7.0",
    # Declared explicitly, though sentence-transformers would pull it anyway, because a
    # `tool.uv.sources` entry only reaches a *direct* dependency. Naming it here is what
    # binds it to the CPU-only index in the workspace root; left transitive, Linux resolves
    # the CUDA build and the corpus-run image grows by ~2 GB it can never use.
    "torch>=2.2.0",
]

[project.scripts]
codesheriff-worker = "codesheriff_worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_worker"]
