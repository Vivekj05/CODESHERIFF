[project]
name = "codesheriff-contracts"
version = "0.1.0"
description = "The single shared contract. Never vendored."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_contracts"]
