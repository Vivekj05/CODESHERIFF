rationale: >-
  report_id is caller-supplied and the report is fetched and then shared outside the
  account with no ownership assertion. Both merged methods on this service call
  assert_owner with the fetched row and the current user immediately after the lookup,
  so the guard is an established step in this repository's report flow rather than a
  suggestion. Sharing is the most damaging of the three operations, and it is the one
  that omits the check.
