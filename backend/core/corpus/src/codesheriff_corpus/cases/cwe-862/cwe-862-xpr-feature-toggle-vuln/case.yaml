rationale: >-
  The control this repository uses for flag administration is a call at the top of the
  body, not a decorator: both merged flag views open with ensure_staff(request.user).
  This case exists so that the agent's notion of a control is not fixed to decorators. A
  repository that guards with an entry call establishes its convention just as firmly,
  and an agent that only read decorators would report nothing here while claiming to
  reason from precedent.
