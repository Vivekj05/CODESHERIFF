decorators: ['@bp.post("/flags/<name>")']
imports: [flask.jsonify, flask.request]
detectable_by: [semantic.hosted, context.rag]
precedent:
  - pr_number: 170
    file: app/flags/views.py
    qualified_symbol: list_feature_flags
