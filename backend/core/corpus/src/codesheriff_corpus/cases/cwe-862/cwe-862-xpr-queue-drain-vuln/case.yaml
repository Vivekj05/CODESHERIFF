rationale: >-
  A handler moved out of app/jobs/legacy_queue.py into app/jobs/queue.py, losing the
  admin_required decorator on the way. The single precedent record is the same qualified
  symbol under its old path, and that is the point of the case: one merge of this exact
  function carrying the control is enough to establish it, whereas a rule that only
  recognised a convention shared across several symbols would need company it does not
  have here. The file changed too, so matching on path would also miss it.
