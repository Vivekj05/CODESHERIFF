rationale: >-
  A new method on a service class whose two other mutating methods were each merged
  carrying the same permission_required decorator. Inviting a member with a role is a
  membership mutation of the same kind, so the convention this repository established
  covers it. Nothing inside the method body is wrong; the case is entirely about a
  control the class has and this method does not, which no analysis of the unit in
  isolation can see.
