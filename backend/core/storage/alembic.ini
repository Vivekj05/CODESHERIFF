# Alembic configuration. One chain for the whole workspace — per-package chains would give the
# schema several heads and no single answer to "what is deployed".
#
#   uv run alembic -c packages/storage/alembic.ini upgrade head
#   uv run alembic -c packages/storage/alembic.ini downgrade base
#
# The database URL is NOT set here. `migrations/env.py` resolves it from -x db_url, then
# DATABASE_URL, then StorageConfig — so a migration can never be run against a hardcoded host that
# happened to be in a config file.

[alembic]
script_location = %(here)s/src/codesheriff_storage/migrations
prepend_sys_path = %(here)s/src
# Split prepend_sys_path on the OS path separator. Without it Alembic 1.19 falls back to legacy
# splitting on spaces, commas and colons — which mangles a Windows path such as D:\PROJECTS\...
path_separator = os
# `v` prefix so every revision file is a valid Python module name — mypy walks this
# tree, and a module called `0001_initial_schema` is not importable.
file_template = v%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
