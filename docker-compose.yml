# Local development services.
#
# Postgres (with pgvector) and Redis only. The API and worker run on the host
# via `uv run` so the edit/reload loop stays fast.
#
# Note on the runtime agent (Chapter 13): the sandbox is Wasmtime + WASI, NOT a
# container. PROJECT_CONTEXT.md §4 rejects Docker as the sandbox — containers
# are OS-level isolation, not software fault isolation, and the SFI claim
# requires the latter. Docker here is developer convenience, nothing more.

services:
  postgres:
    # pgvector is required (§4); the plain postgres image does not carry it.
    image: pgvector/pgvector:pg16
    container_name: codesheriff-postgres
    environment:
      POSTGRES_USER: codesheriff
      POSTGRES_PASSWORD: codesheriff
      POSTGRES_DB: codesheriff
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Enables the extension on first boot. Alembic owns the schema itself.
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/00-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesheriff -d codesheriff"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codesheriff-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Linux host for a corpus run (Chapter 18). Not started by default:
  # `docker compose up` is for Postgres and Redis, and this container exists to
  # be exec'd into deliberately. Bring it up with
  #   docker compose --profile corpus run --rm corpus-run
  corpus-run:
    profiles: ["corpus"]
    build:
      context: .
      dockerfile: docker/corpus-run/Dockerfile
    image: codesheriff-corpus-run:latest
    container_name: codesheriff-corpus-run
    volumes:
      # The repository itself, read-write: `calibrate observe` writes JSONL into
      # calibration/observations/ and `calibrate record` writes JSON into
      # calibration/responses/, and both are committed artifacts that must land
      # on the host, not in a discarded layer.
      - .:/workspace
      # Note there is deliberately NO volume for the venv. It lives at
      # /opt/venv, outside the bind mount, so the Windows `.venv` inside the
      # repository cannot shadow it. A named volume here would be worse than
      # nothing: Docker seeds an empty one from the image and then keeps it, so
      # a rebuilt image would go on running the dependencies of the old one.
    environment:
      # The semantic witness. The model is pinned rather than defaulted: the
      # recorded calibration responses were made with gemini-3.1-flash-lite, and
      # a test split recorded under a different model would be a different
      # witness from the one whose likelihood ratios were fitted.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env before a run}
      SEMANTIC_MODEL: ${SEMANTIC_MODEL:-gemini-3.1-flash-lite}
      SEMGREP_SEND_METRICS: "off"
    working_dir: /workspace
    # No command. What runs is typed by a person, once.
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

volumes:
  postgres-data:
  redis-data:
