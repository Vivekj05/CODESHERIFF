[project]
name = "codesheriff"
version = "0.1.0"
description = "Bayesian multi-agent security review for GitHub pull requests"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "syrupy>=4.6.0",
    "hypothesis>=6.98.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "import-linter>=2.0",
]

# ---------------------------------------------------------------------------
# uv workspace. One shared `contracts` package; no vendoring.
# See DECISIONS.md D-002.
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/worker"]

[tool.uv.sources]
codesheriff-contracts = { workspace = true }
codesheriff-corpus = { workspace = true }
codesheriff-agent-static = { workspace = true }
codesheriff-agent-semantic = { workspace = true }
codesheriff-agent-context = { workspace = true }
codesheriff-agent-runtime = { workspace = true }
codesheriff-engine = { workspace = true }
codesheriff-patch = { workspace = true }
codesheriff-storage = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src", "apps/*/src"]
# Never touch Markdown. `ruff format` reformats fenced Python blocks inside .md,
# which silently rewrote the archived specs in docs/history/ — the provenance
# record of how the design diverged from its implementation. Those files are
# evidence; they are not code to be tidied.
# Corpus case sources are data, not code (D-046). They are deliberately vulnerable
# by construction, so linting them either fails the gate or pressures someone into
# fixing the vulnerability the case exists to contain.
extend-exclude = ["*.md", "docs/history/", "packages/corpus/src/codesheriff_corpus/cases/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() in parameter defaults is how Typer declares a
# CLI; B008 is a false positive against that idiom, not a defect to fix.
"**/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# The audit found dead code hidden behind `if False` (AUDIT.md 3.1). Keep this on.
warn_unused_ignores = true
# Type-check the shipped source. Every package has a tests/conftest.py, and mypy
# resolves those to one module name and refuses to continue; there is no way to
# disambiguate them while each package keeps a directory called `tests`.
exclude = [
    "/tests/",
    "^build/",
    "/codesheriff_corpus/cases/",
    # The WASI guest driver targets a different interpreter and is read as text, never
    # imported (D-078). Its whole mechanism is a str subclass that misreports what it is,
    # so `--strict` cannot describe it without annotating the lie as the truth. It stays
    # inside `ruff`, which catches the undefined names that would actually break it.
    "/agent_runtime/guest/",
]
mypy_path = [
    # The cassette harness lives in the semantic agent's tests because it is test infrastructure,
    # but `tools/record_cassettes.py` — which is checked — imports it. On the path so the import
    # resolves; still excluded from being checked itself by the `/tests/` rule above.
    "packages/agent_semantic/tests",
    "packages/contracts/src",
    "packages/corpus/src",
    "packages/agent_static/src",
    "packages/agent_semantic/src",
    "packages/agent_context/src",
    "packages/agent_runtime/src",
    "packages/engine/src",
    "packages/patch/src",
    "packages/storage/src",
    "apps/api/src",
    "apps/worker/src",
]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = [
    # Celery ships no py.typed marker. The API touches exactly two of its symbols and both are
    # wrapped in `queue.py`, so the untyped surface stops at that module's boundary.
    "celery.*",
    "networkx.*",
    "tree_sitter.*",
    "tree_sitter_language_pack.*",
    "yaml.*",
    # Optional at runtime and not declared as dependencies. `chromadb` is in fact
    # REJECTED (CLAUDE.md: pgvector instead) and its remaining import is drift
    # that Chapter 12 removes; `sentence_transformers` arrives with the real
    # embedder in the same chapter.
    "chromadb.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
python_files = ["test_*.py"]
# Several packages have a tests/test_agent.py. Under the default prepend import
# mode those collide on module name; importlib mode keeps them distinct without
# scattering __init__.py through the test trees.
addopts = "--strict-markers --import-mode=importlib"
consider_namespace_packages = true
markers = [
    # pgvector cannot be faked on SQLite, and a schema built from metadata is not the schema
    # production runs — so these tests use a real Postgres or they do not run (D-029).
    "db: needs a live Postgres; skipped unless CODESHERIFF_TEST_DB names a throwaway database",
    # Spends free-tier LLM quota and is non-deterministic, so it is never part of a normal run.
    # The default suite replays recorded cassettes instead (D-068).
    "live_api: calls a real LLM provider; skipped unless --live-api is passed",
    # The WASI CPython build is 26 MB and deliberately not committed, so these tests execute
    # a real interpreter inside a real Wasmtime sandbox or they do not run. Same principle as
    # `db` (D-029): a faked sandbox measures the fake, and the isolation claim is the whole
    # deliverable. `runtime-agent doctor` says whether this machine can run them.
    "wasm: needs the pinned WASI CPython build; skipped unless it is present",
]

# ---------------------------------------------------------------------------
# Agent boundary enforcement (PROJECT_CONTEXT.md §5).
#
# Agents may import `contracts` and nothing else. An agent importing a sibling,
# the engine, GitHub, or a DB client fails CI. This replaces the vendored
# contracts.py + SHA-256 checksum scheme, which the audit found had been
# defeated by rewriting the expected hash (AUDIT.md 4.8).
#
# Agent isolation is the one architectural property the pre-refactor code got
# right. This contract is what keeps it.
# ---------------------------------------------------------------------------
[tool.importlinter]
# The "forbidden" contract below names third-party packages (sqlalchemy, celery,
# fastapi, ...), so external imports have to be graphed too.
include_external_packages = true
root_packages = [
    "codesheriff_contracts",
    "codesheriff_corpus",
    "codesheriff_storage",
    "static_agent",
    "semantic_agent",
    "context_agent",
    "agent_runtime",
    "codesheriff_engine",
    "codesheriff_patch",
    "codesheriff_api",
    "codesheriff_worker",
]

[[tool.importlinter.contracts]]
name = "Agents are independent of each other"
type = "independence"
modules = [
    "static_agent",
    "semantic_agent",
    "context_agent",
    "agent_runtime",
]

[[tool.importlinter.contracts]]
name = "Agents know nothing of the engine, apps, or infrastructure"
type = "forbidden"
source_modules = [
    "static_agent",
    "semantic_agent",
    "context_agent",
    "agent_runtime",
]
forbidden_modules = [
    "codesheriff_engine",
    "codesheriff_storage",
    "codesheriff_api",
    "codesheriff_worker",
    "sqlalchemy",
    "celery",
    "githubkit",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "Layered: apps depend on storage depends on engine depends on contracts"
type = "layers"
layers = [
    "codesheriff_api | codesheriff_worker",
    "codesheriff_storage",
    "codesheriff_engine",
    "codesheriff_corpus",
    # Chapter 17. Directly above `contracts` and below everything else, which is the whole
    # statement about what a patcher is allowed to know: a ChangeUnit, a CWE, and nothing about
    # fusion, the corpus, the database or GitHub. `codesheriff_storage` sits above it because
    # `mapping.py` writes a proposal's outcome to a row; the patcher never reaches back.
    "codesheriff_patch",
    "codesheriff_contracts",
]

# ---------------------------------------------------------------------------
# Research integrity, enforced the same way agent isolation is (D-025).
#
# §6 requires every fitted number to be reproducible from the calibration split and a recorded
# corpus hash. A fusion or calibration module that can open a database session turns that into an
# honour system: the next person to need a lookup adds one, and the reproducibility claim quietly
# stops being checkable. Persistence is an application concern — apps/worker writes, apps/api
# reads — and the engine below them cannot see it.
# ---------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Fusion and calibration cannot reach the database"
type = "forbidden"
source_modules = [
    "codesheriff_contracts",
    "codesheriff_corpus",
    "codesheriff_engine",
    "codesheriff_patch",
]
forbidden_modules = [
    "codesheriff_storage",
    "sqlalchemy",
    "alembic",
    "psycopg",
]

# ---------------------------------------------------------------------------
# Ground truth is not an input to analysis (D-045).
#
# Separate from the contract above because the reason is different in kind. That
# one is about layering; this one is about measurement. `CorpusCase` carries
# `label` and `detectable_by`. An agent that can read `label` is not being
# measured, it is being told the answer. An agent that can read `detectable_by`
# can be excused by the very field that exists to excuse it fairly.
#
# The leak would not look like cheating. It would look like a convenient import
# in a test helper that someone later reached for from the agent itself.
# ---------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Nothing that analyses code can see the corpus labels"
type = "forbidden"
source_modules = [
    "static_agent",
    "semantic_agent",
    "context_agent",
    "agent_runtime",
]
forbidden_modules = ["codesheriff_corpus"]

# ---------------------------------------------------------------------------
# The audit path is blind to ground truth too (D-086).
#
# Chapter 14 put the calibration harness in `apps/worker`, because running agents is the
# worker's job and a research harness that loaded them its own way would have measured an
# object production never builds. The cost is that the process which analyses real pull
# requests now has an import path to `label` and `detectable_by`.
#
# This is where that path stops. `codesheriff_worker.calibration` may read the corpus, because
# measuring is what it does. The modules that run an audit may not: `tasks` claims the row,
# `pipeline` drives the analysis and `analysis` runs the agents, and any of the three reaching
# ground truth would mean the shipped path can see the answers it is scored against.
#
# It would not look like cheating. It would look like a convenient import in the pipeline for
# "just checking" whether a unit is a known case.
# ---------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "The audit path cannot see the corpus labels either"
type = "forbidden"
source_modules = [
    "codesheriff_worker.tasks",
    "codesheriff_worker.pipeline",
    "codesheriff_worker.analysis",
    "codesheriff_worker.comment",
    "codesheriff_api",
]
forbidden_modules = ["codesheriff_corpus"]

# ---------------------------------------------------------------------------
# The patcher holds no client of any kind (D-092, D-093).
#
# `codesheriff_patch` drafts a repair and checks it. The model it drafts with arrives through
# the `PatchModel` protocol it declares, and the witnesses that re-examine the repair arrive
# through `Rechecker` — both implemented by `apps/worker`, which is the same split `context.rag`
# uses for retrieval (D-072).
#
# The layers contract above already keeps it away from the engine, the corpus and storage. This
# one names the three things layering cannot: an HTTP client, a GitHub client, and the four
# agents. A patcher that could construct a witness would be a second place deciding what a
# witness is, and a patcher that could open a socket could not be tested without a network.
#
# The practical consequence is the one that matters: the whole draft-verify-retry loop runs
# against a scripted model with no key, no quota and no interpreter.
# ---------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "The patcher reaches no model, no repository and no witness for itself"
type = "forbidden"
source_modules = ["codesheriff_patch"]
forbidden_modules = [
    "static_agent",
    "semantic_agent",
    "context_agent",
    "agent_runtime",
    "codesheriff_api",
    "codesheriff_worker",
    "httpx",
    "githubkit",
    "celery",
]
