[project]
name = "codesheriff-api"
version = "0.1.0"
description = "FastAPI edge: verify HMAC, enqueue, return 202. Performs no analysis."
requires-python = ">=3.12"
dependencies = [
    "codesheriff-contracts",
    "codesheriff-engine",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_api"]
