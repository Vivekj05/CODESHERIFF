[project]
name = "codesheriff-api"
version = "0.1.0"
description = "FastAPI edge: verify HMAC, enqueue, return 202. Performs no analysis."
requires-python = ">=3.12"
dependencies = [
    "codesheriff-contracts",
    "codesheriff-engine",
    "codesheriff-storage",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # auth-app brings the JWT signing needed to mint installation tokens.
    "githubkit[auth-app]>=0.12.0",
    # Publishes the audit task by name. The worker package is NOT a dependency and must not
    # become one - `import-linter` puts both apps on the same layer, and importing the worker
    # would drag the agents and the LLM client into the process that answers GitHub.
    "celery>=5.4.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_api"]
