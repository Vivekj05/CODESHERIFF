[project]
name = "codesheriff-worker"
version = "0.1.0"
description = "Celery worker: owns the audit pipeline and all agents"
requires-python = ">=3.12"
dependencies = [
    "codesheriff-contracts",
    "codesheriff-engine",
    "codesheriff-storage",
    "codesheriff-agent-static",
    "codesheriff-agent-semantic",
    "codesheriff-agent-context",
    "codesheriff-agent-runtime",
    "celery>=5.4.0",
    "redis>=5.0.0",
    # auth-app brings the JWT signing needed to mint installation tokens.
    "githubkit[auth-app]>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesheriff_worker"]
